<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpawnDev.Blazor.BootRecovery.Demo</title>
    <base href="/" />
    <link href="_framework/dotnet.b7gdbxi3cm.js" rel="preload" as="script" fetchpriority="high" crossorigin="anonymous" integrity="sha256-uX0fUCb2q0qosqyzUEIX9S/4o/aV/XG6HwL1lKyWPVc=" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="SpawnDev.Blazor.BootRecovery.Demo.styles.css" rel="stylesheet" /> -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Boots like the SpawnDev demos that run behind the COI service worker: no static Blazor tag; the script registers the
         service worker, reloads once under it, then loads _framework/blazor.webassembly.js itself. -->
    <script src="blazor-coi-serviceworker.js"></script>
</body>

</html>
